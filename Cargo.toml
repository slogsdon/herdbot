[workspace]
resolver = "3"
members = ["crates/herdr-client", "crates/herdbot", "crates/herdbot-core"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/slogsdon/herdbot"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "time"] }
