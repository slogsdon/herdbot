# herdbot routing table. Each candidate entry is "harness:model[:effort]", tried in order;
# the first available harness wins. Model IDs come from the installed CLIs (2026-10-19):
#   claude: environment model list · codex: `codex debug models`
#   cursor: `cursor-agent --list-models` · pi: `pi --list-models` (opencode-go rows only)
# Cost first: the cheapest model that gives acceptable output leads each list; stronger ones are fallbacks.
# Every route names an effort; one that doesn't gets its class's effort, then [default], then medium.

[harness.pi]
provider = "opencode-go"          # enforced: any model outside this provider is rejected
allowlist_from = "pi --list-models"

[default]
effort = "medium"
candidates = ["claude:claude-sonnet-5-5:medium", "codex:gpt-6.1-sol:medium", "pi:kimi-k2.7-code:medium"]

[classes.plan]
candidates = ["claude:claude-sonnet-5-5:medium", "codex:gpt-6.1-sol:medium", "claude:claude-opus-5-5:medium"]

[classes.code]
candidates = ["pi:kimi-k2.7-code:medium", "codex:gpt-6-luna:medium", "claude:claude-haiku-5-5:medium", "codex:gpt-6.1-sol:medium", "claude:claude-sonnet-5-5:medium"]

[classes.review]
candidates = ["codex:gpt-6-luna:medium", "claude:claude-haiku-5-5:medium", "codex:gpt-6.1-sol:medium", "claude:claude-sonnet-5-5:medium"]

[classes.debug]
candidates = ["codex:gpt-6.1-sol:medium", "claude:claude-sonnet-5-5:medium", "claude:claude-opus-5-5:high"]

[classes.explore]   # read-only codebase/file search: cheap + fast
candidates = ["pi:deepseek-v4-flash:low", "claude:claude-haiku-5-5:low", "codex:gpt-6-luna:low"]

[classes.shell]     # also used for "bash"
candidates = ["pi:deepseek-v4-flash:low", "claude:claude-haiku-5-5:low", "codex:gpt-6-luna:low"]

[classes.research]  # web search / synthesis
candidates = ["pi:qwen3.8-max:medium", "claude:claude-sonnet-5-5:medium"]

[classes.media_review]  # vision-capable models only (pi --list-models image column = yes)
candidates = ["pi:mimo-v2.6-pro:medium", "claude:claude-sonnet-5-5:low"]

[classes.browser_use]
candidates = ["claude:claude-sonnet-5-5:medium", "codex:gpt-6.1-sol:medium"]

[classes.computer_use]
candidates = ["claude:claude-sonnet-5-5:medium"]

[classes.custom]    # bot-defined subagents; their own `model` field wins if set
candidates = ["claude:claude-sonnet-5-5:medium", "pi:glm-5.3:medium"]

[classes.compact]   # OptChat memory compactor: cheap and steady; never print mode
effort = "low"
candidates = ["pi:deepseek-v4-flash:low", "claude:claude-haiku-5-5", "codex:gpt-6-luna:low"]

# Per-bot overrides, e.g.:
# [bots.seo-chief]
# default_harness = "pi"
# classes.research = ["pi:kimi-k3:high"]
